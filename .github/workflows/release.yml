name: Release

# Builds the Windows installers and creates a draft GitHub release named after the
# version in src-tauri/tauri.conf.json. Start it either by pushing a tag like v1.1.0
# or with "Run workflow" on the Actions tab (the tag is then created automatically).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Remark v__VERSION__
          releaseBody: See [RELEASE_NOTES.md](https://github.com/leg1tfx/Remark/blob/master/RELEASE_NOTES.md) for what changed.
          releaseDraft: true
